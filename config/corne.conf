# Bluetooth keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Chocofi"

# Enable Bluetooth
CONFIG_ZMK_BLE=y

# Deep sleep & power saving
# Enable deep sleep mode (~20µA draw when asleep) (default: n)
CONFIG_ZMK_SLEEP=y
# Enter idle state after 30 seconds of inactivity (default: 30000)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Enter deep sleep after 15 minutes of inactivity, disconnects BLE (default: 900000)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth
# Max simultaneous connections, 4 profiles + 1 for split half (default: 5)
CONFIG_BT_MAX_CONN=5
# Max paired devices, must match max connections for split keyboards (default: 5)
CONFIG_BT_MAX_PAIRED=5
# Increase transmit power to +8 dBm for more reliable split-half communication (default: 0 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Report peripheral battery level through the central half (default: n)
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Central half fetches battery level from peripheral half (default: n)
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Mouse keys
CONFIG_ZMK_MOUSE=y

# Debounce
# Key press detection delay, 1ms for fast response (default: -1, use driver default)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# Key release detection delay, 5ms to prevent chatter (default: -1, use driver default)
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
