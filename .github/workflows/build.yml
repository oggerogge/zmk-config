on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano
            shield: corne_left
            artifact: corne_left
          - board: nice_nano
            shield: corne_right
            artifact: corne_right
          - board: nice_nano
            shield: settings_reset
            artifact: settings_reset
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: west-build-${{ hashFiles('config/west.yml') }}

      - name: West init
        run: west init -l config

      - name: West update
        run: west update

      - name: West zephyr-export
        run: west zephyr-export

      - name: West build (${{ matrix.shield }})
        run: >
          west build -s zmk/app -b ${{ matrix.board }} --
          -DSHIELD=${{ matrix.shield }}
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Create flash script
        run: |
          cat > build/zephyr/flash.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          MOUNT="/run/media/$USER/NICENANO"
          if [ ! -d "$MOUNT" ]; then
            MOUNT="/media/$USER/NICENANO"
          fi
          if [ ! -d "$MOUNT" ]; then
            echo "NICENANO not found. Enter bootloader mode by double-tapping reset."
            exit 1
          fi
          cp "$SCRIPT_DIR/zmk.uf2" "$MOUNT/"
          sync
          echo "Flashed successfully."
          SCRIPT
          chmod +x build/zephyr/flash.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.artifact }}
          path: |
            build/zephyr/zmk.uf2
            build/zephyr/flash.sh
